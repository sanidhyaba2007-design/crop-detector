<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<title>Crop Disease Detector</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root{--g:#2e7d32;--gl:#e8f5e9;--bg:#f6f8f5;--tx:#1b2a1b;--warn:#b26a00;--card:#fff;--bd:#d9e2d6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
  header{background:var(--g);color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:20px}
  header small{opacity:.85}
  main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button,.btn{border:0;border-radius:10px;padding:12px 14px;font-size:16px;background:var(--g);color:#fff;cursor:pointer}
  button.alt,.btn.alt{background:var(--gl);color:var(--g);border:1px solid var(--bd)}
  button:disabled{opacity:.5}
  select{padding:10px;border-radius:10px;border:1px solid var(--bd);font-size:16px;background:#fff}
  #preview{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:#eee;display:none}
  .status{font-size:14px;color:#555}
  .result h2{margin:6px 0}
  .ok{color:var(--g)} .notsure{color:var(--warn)}
  .bar{height:8px;background:#e3e8e1;border-radius:6px;overflow:hidden;margin:3px 0 8px}
  .bar>i{display:block;height:100%;background:var(--g)}
  .small{font-size:13px;color:#555}
  .hist{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);padding:8px 0}
  .hist img{width:48px;height:48px;object-fit:cover;border-radius:8px}
  input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <h1 id="title">Crop Disease Detector</h1>
  <small id="sub">Rice and Maize · works offline</small>
</header>
<main>
  <div class="card">
    <div class="row" style="align-items:center;justify-content:space-between">
      <label for="lang"><b id="lblLang">Language</b></label>
      <select id="lang">
        <option value="en">English</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>
    <p class="status" id="status">Loading model…</p>
  </div>

  <div class="card">
    <div class="row">
      <label class="btn" for="cam" id="btnCam">Take photo</label>
      <label class="btn alt" for="gal" id="btnGal">Choose photo</label>
    </div>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <input type="file" id="gal" accept="image/*">
    <img id="preview" alt="leaf photo" style="margin-top:12px">
    <canvas id="cv" width="224" height="224" style="display:none"></canvas>
  </div>

  <div class="card result" id="resultCard" style="display:none">
    <h2 id="resTitle"></h2>
    <div id="resBars"></div>
    <p id="resAdvice"></p>
    <p class="small" id="resNote"></p>
    <button class="alt" id="btnSpeak">🔊 Read aloud</button>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <b id="lblHist">Scan history</b>
      <button class="alt" id="btnClear" style="padding:6px 10px;font-size:14px">Clear</button>
    </div>
    <div id="hist"></div>
  </div>

  <p class="small" id="foot"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

// ---------- custom Rescaling layer (in case this TF.js build lacks it) ----------
class Rescaling extends tf.layers.Layer {
  constructor(cfg){ super(cfg); this.scale = cfg.scale; this.offset = cfg.offset; }
  computeOutputShape(s){ return s; }
  call(inputs){ return tf.tidy(()=>{ const x = Array.isArray(inputs)?inputs[0]:inputs; return x.mul(this.scale).add(this.offset); }); }
  getConfig(){ return Object.assign(super.getConfig(), {scale:this.scale, offset:this.offset}); }
  static get className(){ return "Rescaling"; }
}
try { tf.serialization.registerClass(Rescaling); } catch(e) { /* already built in */ }

// ---------- app ----------
const $ = id => document.getElementById(id);
let model = null, lang = localStorage.getItem("lang") || "en", last = null;

function t(k){ return UI[lang][k]; }
function applyLang(){
  document.documentElement.lang = lang;
  $("title").textContent = t("title"); $("sub").textContent = t("sub");
  $("lblLang").textContent = t("lang"); $("btnCam").textContent = t("cam"); $("btnGal").textContent = t("gal");
  $("lblHist").textContent = t("hist"); $("btnClear").textContent = t("clear"); $("btnSpeak").textContent = t("speak");
  $("foot").textContent = t("foot");
  $("status").textContent = model ? t("ready") : t("loading");
  $("lang").value = lang;
  if(last) showResult(last); renderHistory();
}

async function loadModel(){
  try{
    model = await tf.loadLayersModel(MODEL_URL);
    tf.tidy(()=>model.predict(tf.zeros([1,224,224,3])));   // warm up
    $("status").textContent = t("ready");
  }catch(e){
    console.error(e); $("status").textContent = t("fail") + " (" + e.message + ")";
  }
}

function loadImage(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res(img); img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

async function handleFile(file){
  if(!file || !model) return;
  const img = await loadImage(file);
  const pv = $("preview"); pv.src = img.src; pv.style.display = "block";
  const cv = $("cv"), ctx = cv.getContext("2d");
  ctx.drawImage(img, 0, 0, 224, 224);
  const probs = tf.tidy(()=>{
    const x = tf.browser.fromPixels(cv).toFloat().expandDims(0);  // 0..255, model rescales itself
    return model.predict(x).dataSync();
  });
  const arr = Array.from(probs);
  const order = arr.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0]);
  const top = order[0];
  last = { cls: CLASSES[top[1]], conf: top[0], notSure: top[0] < THRESHOLD,
           top3: order.slice(0,3).map(([p,i])=>({cls:CLASSES[i],p})) };
  showResult(last);
  saveHistory(last, thumb(img));
}

function thumb(img){
  const c = document.createElement("canvas"); c.width = 96; c.height = 96;
  c.getContext("2d").drawImage(img,0,0,96,96); return c.toDataURL("image/jpeg",0.6);
}

function showResult(r){
  $("resultCard").style.display = "block";
  const T = $("resTitle");
  if(r.notSure){
    T.className = "notsure"; T.textContent = "⚠ " + t("notsure");
    $("resAdvice").textContent = t("tips");
  }else{
    const info = INFO[r.cls];
    T.className = "ok"; T.textContent = (info ? info.name[lang] : r.cls) + " (" + Math.round(r.conf*100) + "%)";
    $("resAdvice").textContent = info ? info.adv[lang] : "";
  }
  $("resNote").textContent = t("note");
  $("resBars").innerHTML = r.top3.map(x=>{
    const n = INFO[x.cls] ? INFO[x.cls].name[lang] : x.cls;
    return `<div class="small">${n} — ${Math.round(x.p*100)}% ${t("conf")}</div><div class="bar"><i style="width:${Math.round(x.p*100)}%"></i></div>`;
  }).join("");
}

function speak(){
  if(!last || !("speechSynthesis" in window)) return;
  const text = $("resTitle").textContent + ". " + $("resAdvice").textContent + " " + $("resNote").textContent;
  const code = {en:"en-IN", kn:"kn-IN", hi:"hi-IN"}[lang];
  const voices = speechSynthesis.getVoices();
  const has = voices.some(v=>v.lang && v.lang.replace("_","-").toLowerCase().startsWith(code.slice(0,2)));
  if(voices.length && !has){ alert(t("nov")); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = code; speechSynthesis.speak(u);
}

function saveHistory(r, th){
  let h = []; try{ h = JSON.parse(localStorage.getItem("hist")||"[]"); }catch(e){}
  h.unshift({ts:Date.now(), cls:r.cls, conf:r.conf, notSure:r.notSure, th});
  h = h.slice(0,20);
  try{ localStorage.setItem("hist", JSON.stringify(h)); }catch(e){}
  renderHistory();
}
function renderHistory(){
  let h = []; try{ h = JSON.parse(localStorage.getItem("hist")||"[]"); }catch(e){}
  $("hist").innerHTML = h.map(x=>{
    const n = x.notSure ? t("notsure") : (INFO[x.cls] ? INFO[x.cls].name[lang] : x.cls);
    return `<div class="hist"><img src="${x.th}" alt=""><div><b>${n}</b><div class="small">${Math.round(x.conf*100)}% · ${new Date(x.ts).toLocaleString()}</div></div></div>`;
  }).join("");
}

$("cam").addEventListener("change", e=>handleFile(e.target.files[0]));
$("gal").addEventListener("change", e=>handleFile(e.target.files[0]));
$("lang").addEventListener("change", e=>{ lang = e.target.value; localStorage.setItem("lang", lang); applyLang(); });
$("btnSpeak").addEventListener("click", speak);
$("btnClear").addEventListener("click", ()=>{ localStorage.removeItem("hist"); renderHistory(); });

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(console.error); }
applyLang(); loadModel();
</script>
</body>
</html>
